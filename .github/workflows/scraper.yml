name: YSBA Live Data Scraper

on:
  schedule:
    # Run every 30 minutes (updated 2025-06-09)
    - cron: '*/30 * * * *'
  
  # Allow manual trigger for testing
  workflow_dispatch:
  
  # Run on push to main for testing
  push:
    branches: [ main ]
    paths: 
      - 'src/scraper/**'
      - '.github/workflows/scraper.yml'

concurrency:
  group: scraper
  cancel-in-progress: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        persist-credentials: true
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Puppeteer Chrome
      run: npx puppeteer browsers install chrome
    
    - name: Run YSBA scraper
      run: npm run scrape-github-action
      env:
        NODE_ENV: production
        PUPPETEER_ARGS: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-accelerated-2d-canvas,--no-first-run,--no-zygote,--single-process,--disable-gpu,--disable-extensions
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        FROM_NAME: ${{ secrets.FROM_NAME }}
        BASE_URL: ${{ secrets.BASE_URL }}
        GITHUB_TOKEN: ${{ secrets.GIST_GITHUB_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Backup freshly scraped data before any git operations
        cp -r public/ /tmp/public_backup/
        cp -r data/ /tmp/data_backup/

        # Fetch latest from origin to get any changes that happened during scraping
        git fetch origin main

        # Stash our freshly scraped data files
        git stash push --include-untracked -- public/ data/

        # Reset to whatever is currently on origin/main
        git reset --hard origin/main

        # Apply our freshly scraped data back on top
        git stash pop || true

        # Stage and check for actual changes
        git add public/ data/ || true

        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        # Commit and push
        git commit -m "🤖 Update YSBA data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')

        - Scraped $(date -u '+%Y-%m-%d at %H:%M UTC')
        - Updated standings and schedules
        - Generated optimized JSON files

        🤖 Generated with GitHub Actions"

        # Push with retry in case of race condition
        for i in 1 2 3; do
          if git push; then
            echo "✅ Push successful"
            exit 0
          fi
          echo "Push failed, retrying... (attempt $i/3)"
          sleep 2

          # Save our freshly scraped data before resetting
          cp -r public/ /tmp/public_backup/
          cp -r data/ /tmp/data_backup/

          # Abort any failed rebase and reset to origin
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main

          # Restore our freshly scraped data
          cp -r /tmp/public_backup/* public/
          cp -r /tmp/data_backup/* data/

          # Recommit
          git add public/ data/
          git commit -m "🤖 Update YSBA data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')

        - Scraped $(date -u '+%Y-%m-%d at %H:%M UTC')
        - Updated standings and schedules
        - Generated optimized JSON files

        🤖 Generated with GitHub Actions"
        done
        echo "❌ Push failed after 3 attempts"
        exit 1

    - name: Trigger Render deployment
      run: |
        echo "✅ Data updated and pushed to repository"
        echo "🚀 Render will automatically redeploy with new data"